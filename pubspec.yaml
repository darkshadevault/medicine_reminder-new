name: medicine_reminder
description: Aplikasi pengingat minum obat modern dan mudah digunakan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Semua sudah sesuai versi terbaru & stabil (November 2025)
  flutter_local_notifications: ^17.2.4
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1   # versi terbaru kamu sudah benar

  # Tambahan WAJIB yang masih kurang di pubspec lama kamu:
  flutter_local_notifications_platform_interface: any  # biar tidak error di Android 14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # (Opsional) Kalau mau tambah icon app nanti
  # assets:
  #   - assets/icon/